<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Chat — Jasa Aplikasi</title>
<style>
  * { box-sizing: border-box; font-family: system-ui, sans-serif; }
  body { margin:0; background:#f0f2f5; }
  header { background:#0052cc; color:#fff; padding:14px 20px; font-weight:bold; }
  .wrap { display:flex; max-width:1000px; margin:20px auto; gap:15px; padding:0 15px; }
  #daftar-chat { width:280px; background:#fff; border-radius:12px; overflow:hidden; }
  .chat-item { display:block; width:100%; text-align:left; padding:12px 14px; border:none;
               border-bottom:1px solid #eee; background:#fff; cursor:pointer; }
  .chat-item small { color:#888; display:block; }
  .chat-item.aktif { background:#e8f0fe; }
  #panel { flex:1; background:#fff; border-radius:12px; display:flex; flex-direction:column; height:70vh; }
  #pesan-admin { flex:1; overflow-y:auto; padding:15px; }
  .baris { margin-bottom:10px; }
  .user { color:#0052cc; font-weight:600; }
  .admin { color:#0a7d33; font-weight:600; text-align:right; }
  form { display:flex; border-top:1px solid #eee; }
  input { flex:1; padding:14px; border:none; outline:none; font-size:15px; }
  button { background:#0052cc; color:#fff; border:none; padding:0 25px; cursor:pointer; }
</style>
</head>
<body>
<header>💬 Admin Chat — Jasa Aplikasi UMKM</header>
<div class="wrap">
  <div id="daftar-chat"></div>
  <div id="panel">
    <div id="pesan-admin"><p style="color:#999">← Pilih chat pengunjung di sebelah kiri.</p></div>
    <form id="form-admin">
      <input id="input-admin" placeholder="Ketik balasan Anda..." autocomplete="off">
      <button type="submit">Kirim</button>
    </form>
  </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getDatabase, ref, push, set, onValue, query, orderByChild } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

  const firebaseConfig = { /* SAMAKAN dengan index.html */ };
  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);

  const daftarEl = document.getElementById('daftar-chat');
  const pesanEl  = document.getElementById('pesan-admin');
  const form     = document.getElementById('form-admin');
  const inputEl  = document.getElementById('input-admin');

  let chatAktif = null, berhentiDengar = null;

  // ====== Daftar semua pengunjung (terbaru di atas) ======
  onValue(query(ref(db, "chats"), orderByChild("info/lastTime")), (snapshot) => {
    const daftar = [];
    snapshot.forEach((child) => daftar.push(child));
    daftar.reverse();

    daftarEl.innerHTML = "";
    daftar.forEach((child) => {
      const info = child.val().info || {};
      const btn = document.createElement('button');
      btn.className = 'chat-item' + (child.key === chatAktif ? ' aktif' : '');
      const small = document.createElement('small');
      small.textContent = child.key;
      const span = document.createElement('span');
      span.textContent = info.lastMessage || "(belum ada pesan)";
      btn.appendChild(small); btn.appendChild(span);
      btn.onclick = () => bukaChat(child.key);
      daftarEl.appendChild(btn);
    });
  });

  // ====== Buka satu chat + dengarkan real-time ======
  function bukaChat(id) {
    chatAktif = id;
    if (berhentiDengar) berhentiDengar();
    berhentiDengar = onValue(ref(db, "chats/" + id + "/messages"), (snap) => {
      pesanEl.innerHTML = "";
      snap.forEach((child) => {
        const d = child.val();
        const div = document.createElement('div');
        div.className = 'baris ' + d.pengirim;
        div.textContent = (d.pengirim === 'admin' ? '👨‍💼 Anda: ' : '👤 Pengunjung: ') + d.teks;
        pesanEl.appendChild(div);
      });
      pesanEl.scrollTop = pesanEl.scrollHeight;
    });
  }

  // ====== Kirim balasan admin ======
  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const teks = inputEl.value.trim();
    if (!teks || !chatAktif) return;
    await push(ref(db, "chats/" + chatAktif + "/messages"), {
      teks: teks, pengirim: "admin", waktu: Date.now()
    });
    await set(ref(db, "chats/" + chatAktif + "/info"), {
      lastMessage: "Admin: " + teks, lastTime: Date.now()
    });
    inputEl.value = "";
  });
  </script>
</body>
</html>
