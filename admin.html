<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Chat — Jasa Aplikasi UMKM</title>
<style>
  * { box-sizing: border-box; font-family: system-ui, sans-serif; margin: 0; }
  body { background: #f0f2f5; }
  header { background: #0052cc; color: #fff; padding: 14px 16px; font-weight: bold; }
  .wrap { display: flex; max-width: 1000px; margin: 0 auto; }

  /* ====== MODE HP: tampilkan SATU layar bergantian ====== */
  #daftar-chat { width: 100%; background: #fff; min-height: calc(100vh - 52px); }
  #panel { display: none; flex-direction: column; width: 100%; height: calc(100vh - 52px); background: #fff; }
  body.mode-chat #daftar-chat { display: none; }   /* sembunyikan daftar */
  body.mode-chat #panel { display: flex; }          /* tampilkan percakapan */

  #btn-kembali { display: block; width: 100%; padding: 10px; border: none;
                 background: #e8f0fe; color: #0052cc; font-weight: bold; cursor: pointer; }

  /* ====== MODE LAPTOP (lebar >= 768px): berdampingan ====== */
  @media (min-width: 768px) {
    .wrap { padding: 20px; gap: 15px; }
    #daftar-chat { width: 320px; min-height: auto; height: calc(100vh - 92px); border-radius: 12px; overflow: hidden; }
    #panel { display: flex; flex: 1; border-radius: 12px; height: calc(100vh - 92px); }
    body.mode-chat #daftar-chat { display: block; }
    #btn-kembali { display: none; }
  }

  /* Item daftar pengunjung */
  .chat-item { display: block; width: 100%; text-align: left; padding: 14px 16px;
               border: none; border-bottom: 1px solid #eee; background: #fff; cursor: pointer; }
  .chat-item.aktif { background: #e8f0fe; }
  .chat-item b { display: block; font-size: 14px; color: #333; word-break: break-all; }
  .chat-item small { color: #888; }
  .kosong { padding: 30px 20px; color: #999; text-align: center; }

  /* Gelembung pesan */
  #pesan-admin { flex: 1; overflow-y: auto; padding: 15px; background: #f7f8fa; }
  .baris { display: flex; margin-bottom: 8px; }
  .baris.user { justify-content: flex-start; }    /* pesan pengunjung: kiri */
  .baris.admin { justify-content: flex-end; }     /* balasan Anda: kanan */
  .buble { max-width: 75%; padding: 9px 13px; border-radius: 14px; font-size: 14px; word-break: break-word; }
  .baris.user .buble { background: #e4e6eb; color: #000; border-bottom-left-radius: 4px; }
  .baris.admin .buble { background: #0052cc; color: #fff; border-bottom-right-radius: 4px; }
  .buble small { display: block; font-size: 10px; opacity: .7; margin-top: 3px; }

  /* Form balasan */
  form { display: flex; border-top: 1px solid #ddd; }
  #input-admin { flex: 1; padding: 14px; border: none; outline: none; font-size: 15px; }
  #kirim-admin { background: #0052cc; color: #fff; border: none; padding: 0 22px; cursor: pointer; }
</style>
</head>
<body>

<header>💬 Admin Chat — Jasa Aplikasi UMKM</header>

<div class="wrap">

  <!-- LAYAR 1: Daftar pengunjung -->
  <div id="daftar-chat">
    <p class="kosong">Memuat daftar chat...</p>
  </div>

  <!-- LAYAR 2: Percakapan -->
  <div id="panel">
    <button id="btn-kembali">← Kembali ke daftar chat</button>
    <div id="pesan-admin"><p class="kosong">← Pilih chat pengunjung.</p></div>
    <form id="form-admin">
      <input id="input-admin" placeholder="Ketik balasan Anda..." autocomplete="off">
      <button id="kirim-admin" type="submit">Kirim</button>
    </form>
  </div>

</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getDatabase, ref, push, set, onValue, query, orderByChild } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

  // ====== SAMAKAN dengan index.html ======
  const firebaseConfig = {
  apiKey: "AIzaSyA3C3BpjOrEA16sop2uIIo52pVvFtAyEDQ",
  authDomain: "jasa-pembuatan-aplikasi-batam.firebaseapp.com",
  databaseURL: "https://jasa-pembuatan-aplikasi-batam-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "jasa-pembuatan-aplikasi-batam",
  storageBucket: "jasa-pembuatan-aplikasi-batam.firebasestorage.app",
  messagingSenderId: "30894586214",
  appId: "1:30894586214:web:def6ccb3da69ebc26e30a7"
};

  const app = initializeApp(firebaseConfig);
  const db  = getDatabase(app);

  const daftarEl   = document.getElementById('daftar-chat');
  const pesanEl    = document.getElementById('pesan-admin');
  const form       = document.getElementById('form-admin');
  const inputEl    = document.getElementById('input-admin');
  const btnKembali = document.getElementById('btn-kembali');

  let chatAktif = null, berhentiDengar = null;

  // ====== LAYAR 1: Daftar semua pengunjung (terbaru di atas) ======
  onValue(query(ref(db, "chats"), orderByChild("info/lastTime")), (snapshot) => {
    const daftar = [];
    snapshot.forEach(child => daftar.push(child));
    daftar.reverse();

    daftarEl.innerHTML = "";
    if (daftar.length === 0) {
      daftarEl.innerHTML = "<p class='kosong'>Belum ada pengunjung yang chat.</p>";
      return;
    }

    daftar.forEach(child => {
      const info = child.val().info || {};
      const btn  = document.createElement('button');
      btn.className = 'chat-item' + (child.key === chatAktif ? ' aktif' : '');
      const b = document.createElement('b');
      b.textContent = "💬 Pengunjung";           // setiap HP pengunjung = 1 chat
      const small = document.createElement('small');
      small.textContent = info.lastMessage || "(belum ada pesan)";
      btn.appendChild(b); btn.appendChild(small);
      btn.onclick = () => bukaChat(child.key);
      daftarEl.appendChild(btn);
    });
  });

  // ====== LAYAR 2: Buka percakapan ======
  function bukaChat(id) {
    chatAktif = id;
    document.body.classList.add('mode-chat'); // HP: pindah ke layar percakapan

    if (berhentiDengar) berhentiDengar();
    berhentiDengar = onValue(ref(db, "chats/" + id + "/messages"), (snap) => {
      pesanEl.innerHTML = "";
      snap.forEach(child => {
        const d = child.val();
        const baris = document.createElement('div');
        baris.className = 'baris ' + (d.pengirim === 'admin' ? 'admin' : 'user');
        const buble = document.createElement('div');
        buble.className = 'buble';
        const teks = document.createElement('span');
        teks.textContent = d.teks;
        const waktu = document.createElement('small');
        waktu.textContent = d.waktu ? new Date(d.waktu).toLocaleTimeString("id-ID", {hour:'2-digit', minute:'2-digit'}) : "";
        buble.appendChild(teks); buble.appendChild(waktu);
        baris.appendChild(buble);
        pesanEl.appendChild(baris);
      });
      pesanEl.scrollTop = pesanEl.scrollHeight;
    });
  }

  // ====== Tombol kembali (khusus HP) ======
  btnKembali.onclick = () => {
    document.body.classList.remove('mode-chat');
    chatAktif = null;
  };

  // ====== KIRIM BALASAN (kini ada peringatan jelas!) ======
  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const teks = inputEl.value.trim();
    if (teks === "") return;

    if (!chatAktif) {
      alert("Pilih dulu salah satu pengunjung di daftar, baru ketik balasan ya! 👆");
      return;
    }

    await push(ref(db, "chats/" + chatAktif + "/messages"), {
      teks: teks, pengirim: "admin", waktu: Date.now()
    });
    await set(ref(db, "chats/" + chatAktif + "/info"), {
      lastMessage: "Admin: " + teks, lastTime: Date.now()
    });
    inputEl.value = "";
  });
</script>
</body>
</html>
