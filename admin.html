<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Chat — Jasa Pembuatan Aplikasi UMKM</title>
<meta name="robots" content="noindex,nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link rel="stylesheet" href="admin.css">
</head>
<body>

<!-- ====== LAYAR LOGIN PIN ====== -->
<div class="login-overlay" id="login-overlay">
  <form class="login-card" id="login-form" autocomplete="off">
    <div class="login-icon"><i class="fa-solid fa-lock"></i></div>
    <h2>Panel Admin Chat</h2>
    <p class="login-sub">Masukkan PIN 6 digit untuk membalas chat pengunjung.</p>
    <input type="password" inputmode="numeric" pattern="[0-9]{6}" maxlength="6"
           id="pin-input" class="pin-input" placeholder="6 digit" autocomplete="off" autofocus>
    <p class="login-err" id="login-err" hidden>PIN salah. Coba lagi.</p>
    <button type="submit" class="login-btn">Masuk</button>
  </form>
</div>

<!-- ====== DASHBOARD ====== -->
<div class="admin-app" id="admin-app" hidden>
  <header class="admin-topbar">
    <div class="admin-brand"><i class="fa-solid fa-headset"></i> Admin Chat — Jasa Aplikasi</div>
    <button class="admin-logout" id="btn-logout" title="Keluar"><i class="fa-solid fa-right-from-bracket"></i> Keluar</button>
  </header>

  <main class="admin-layout">
    <!-- DAFTAR SESI -->
    <aside class="panel-sesi">
      <div class="panel-head">
        <h3><i class="fa-solid fa-inbox"></i> Percakapan</h3>
        <span class="total-sesi" id="total-sesi">0</span>
      </div>
      <div class="search-wrap">
        <i class="fa-solid fa-magnifying-glass"></i>
        <input type="text" id="search-sesi" placeholder="Cari percakapan...">
      </div>
      <div class="daftar-sesi" id="daftar-sesi">
        <p class="empty-state">Belum ada percakapan masuk.</p>
      </div>
    </aside>

    <!-- DETAIL PERCAKAPAN -->
    <section class="panel-chat">
      <!-- STATE KOSONG -->
      <div class="chat-placeholder" id="chat-placeholder">
        <i class="fa-solid fa-comments"></i>
        <p>Pilih percakapan di sebelah kiri untuk membalas satu per satu.</p>
      </div>

      <!-- STATE AKTIF -->
      <div class="chat-aktif" id="chat-aktif" hidden>
        <header class="chat-head">
          <button class="chat-back" id="chat-back" aria-label="Kembali ke daftar"><i class="fa-solid fa-arrow-left"></i></button>
          <div class="chat-head-info">
            <h4 id="chat-nama">Pengunjung</h4>
            <small id="chat-id"></small>
          </div>
          <span class="chat-status" id="chat-status">Online</span>
        </header>
        <div class="chat-msgs" id="chat-msgs"></div>
        <footer class="chat-reply">
          <input type="text" id="input-balas" placeholder="Tulis balasan..." autocomplete="off">
          <button id="btn-balas" aria-label="Kirim balasan"><i class="fa-solid fa-paper-plane"></i></button>
        </footer>
      </div>
    </section>
  </main>
</div>

<script type="module" src="admin.js"></script>
</body>
</html>
